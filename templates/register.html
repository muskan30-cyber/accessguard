<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AccessGuard — Register</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg: #0a0a0f; --surface: #12121a; --border: #1e1e2e;
    --accent: #00ff88; --accent2: #00cfff; --danger: #ff3c5f;
    --text: #e8e8f0; --muted: #6b6b80;
    --mono: 'Space Mono', monospace; --sans: 'Syne', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text); font-family: var(--sans);
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
  }
  .grid-bg {
    position: fixed; inset: 0;
    background-image: linear-gradient(rgba(0,255,136,.03) 1px,transparent 1px),
      linear-gradient(90deg,rgba(0,255,136,.03) 1px,transparent 1px);
    background-size: 40px 40px; pointer-events: none;
  }
  .card {
    position: relative; width: 100%; max-width: 440px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 6px; padding: 2.5rem;
    animation: fadeUp .6s ease both;
  }
  @keyframes fadeUp { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }
  .card-header { margin-bottom: 2rem; }
  .back { font-family: var(--mono); font-size: .7rem; color: var(--muted);
    text-decoration: none; letter-spacing: .1em; display: inline-block; margin-bottom: 1.5rem; }
  .back:hover { color: var(--accent); }
  h2 { font-size: 1.8rem; font-weight: 800; }
  h2 span { color: var(--accent); }
  .sub { font-family: var(--mono); font-size: .72rem; color: var(--muted);
    letter-spacing: .05em; margin-top: .3rem; }

  .form-group { margin-bottom: 1.2rem; }
  label { display: block; font-family: var(--mono); font-size: .7rem;
    letter-spacing: .1em; color: var(--muted); text-transform: uppercase; margin-bottom: .5rem; }
  input, select {
    width: 100%; background: var(--bg); border: 1px solid var(--border);
    border-radius: 3px; padding: .75rem 1rem; color: var(--text);
    font-family: var(--mono); font-size: .85rem;
    transition: border-color .2s;
  }
  input:focus, select:focus { outline: none; border-color: var(--accent); }
  select option { background: var(--bg); }

  .btn-submit {
    width: 100%; background: var(--accent); color: #000; border: none;
    padding: .9rem; font-family: var(--mono); font-size: .85rem;
    font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
    border-radius: 3px; cursor: pointer; transition: all .2s; margin-top: .5rem;
  }
  .btn-submit:hover { background: #00e87a; transform: translateY(-1px); box-shadow: 0 6px 20px rgba(0,255,136,.25); }

  .alert { padding: .8rem 1rem; border-radius: 3px; font-family: var(--mono);
    font-size: .78rem; margin-bottom: 1.2rem; }
  .alert-error { background: rgba(255,60,95,.1); border: 1px solid rgba(255,60,95,.3); color: var(--danger); }
  .alert-success { background: rgba(0,255,136,.08); border: 1px solid rgba(0,255,136,.2); color: var(--accent); }

  .footer-link { text-align: center; margin-top: 1.5rem;
    font-family: var(--mono); font-size: .72rem; color: var(--muted); }
  .footer-link a { color: var(--accent2); text-decoration: none; }
  .footer-link a:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="grid-bg"></div>
<div class="card">
  <div class="card-header">
    <a href="/" class="back">← home</a>
    <h2>Create <span>Account</span></h2>
    <p class="sub">// register a new user or admin</p>
  </div>

  {% if error %}
  <div class="alert alert-error">⚠ {{ error }}</div>
  {% endif %}
  {% if success %}
  <div class="alert alert-success">✓ {{ success }}</div>
  {% endif %}

  <form method="post" action="/register">
    <div class="form-group">
      <label>Username</label>
      <input type="text" name="username" placeholder="e.g. john_doe" required/>
    </div>
    <div class="form-group">
      <label>Email</label>
      <input type="email" name="email" placeholder="you@example.com" required/>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" name="password" placeholder="••••••••" required/>
    </div>
    <div class="form-group">
      <label>Role</label>
      <select name="role">
        <option value="user">User</option>
        <option value="admin">Admin</option>
      </select>
    </div>
    <button type="submit" class="btn-submit">Register →</button>
  </form>

  <div class="footer-link">Already have an account? <a href="/login">Login here</a></div>
</div>
</body>
</html>
