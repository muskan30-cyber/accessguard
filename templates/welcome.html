<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AccessGuard — Welcome</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg: #0a0a0f; --surface: #12121a; --border: #1e1e2e;
    --accent: #00ff88; --accent2: #00cfff; --text: #e8e8f0; --muted: #6b6b80;
    --mono: 'Space Mono', monospace; --sans: 'Syne', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text); font-family: var(--sans);
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center; gap: 0;
  }
  .grid-bg {
    position: fixed; inset: 0;
    background-image: linear-gradient(rgba(0,255,136,.03) 1px,transparent 1px),
      linear-gradient(90deg,rgba(0,255,136,.03) 1px,transparent 1px);
    background-size: 40px 40px; pointer-events: none;
  }
  .ring {
    position: relative; width: 120px; height: 120px; margin-bottom: 2rem;
    animation: fadeUp .5s ease both;
  }
  .ring svg { width: 100%; height: 100%; animation: spin 20s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .ring-inner {
    position: absolute; inset: 20px;
    background: var(--surface); border-radius: 50%;
    border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 2rem;
  }
  @keyframes fadeUp { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }
  h1 { font-size: 2.8rem; font-weight: 800; animation: fadeUp .6s .1s ease both; }
  h1 span { color: var(--accent); }
  .sub { font-family: var(--mono); font-size: .78rem; color: var(--muted);
    letter-spacing: .08em; margin: .6rem 0 2.5rem; animation: fadeUp .6s .2s ease both; }

  .status-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 6px; padding: 1.5rem 2rem;
    font-family: var(--mono); font-size: .78rem; color: var(--muted);
    animation: fadeUp .6s .3s ease both; margin-bottom: 2rem;
    min-width: 300px; text-align: left;
  }
  .status-row { display: flex; justify-content: space-between; gap: 2rem; margin-bottom: .5rem; }
  .status-row:last-child { margin-bottom: 0; }
  .status-key { color: var(--muted); }
  .status-val { color: var(--accent); font-weight: 700; }

  .btn {
    font-family: var(--mono); font-size: .78rem; letter-spacing: .1em;
    text-decoration: none; padding: .75rem 2rem; border-radius: 3px;
    text-transform: uppercase; font-weight: 700; transition: all .2s;
    border: 1px solid var(--border); color: var(--muted);
    animation: fadeUp .6s .4s ease both; display: inline-block;
  }
  .btn:hover { border-color: var(--danger); color: #ff6b84; }
</style>
</head>
<body>
<div class="grid-bg"></div>

<div class="ring">
  <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
    <circle cx="50" cy="50" r="46" stroke="#1e1e2e" stroke-width="1.5" stroke-dasharray="4 8"/>
    <circle cx="50" cy="50" r="46" stroke="url(#g)" stroke-width="1.5" stroke-dasharray="60 230" stroke-linecap="round"/>
    <defs>
      <linearGradient id="g" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#00ff88"/>
        <stop offset="100%" stop-color="#00cfff"/>
      </linearGradient>
    </defs>
  </svg>
  <div class="ring-inner">✓</div>
</div>

<h1>Hello, <span>{{ username }}</span>!</h1>
<p class="sub">// authentication successful — access granted</p>

<div class="status-card">
  <div class="status-row"><span class="status-key">status</span><span class="status-val">AUTHENTICATED</span></div>
  <div class="status-row"><span class="status-key">role</span><span class="status-val">USER</span></div>
  <div class="status-row"><span class="status-key">session</span><span class="status-val">ACTIVE</span></div>
</div>

<a href="/" class="btn">← Logout / Return Home</a>
</body>
</html>
