<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AccessGuard — Secure Auth System</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #12121a;
    --border: #1e1e2e;
    --accent: #00ff88;
    --accent2: #00cfff;
    --danger: #ff3c5f;
    --text: #e8e8f0;
    --muted: #6b6b80;
    --mono: 'Space Mono', monospace;
    --sans: 'Syne', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .grid-bg {
    position: fixed; inset: 0;
    background-image:
      linear-gradient(rgba(0,255,136,.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,255,136,.04) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
  }
  .glow {
    position: fixed;
    width: 600px; height: 600px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(0,255,136,.12) 0%, transparent 70%);
    top: -200px; left: -200px;
    pointer-events: none;
    animation: floatGlow 8s ease-in-out infinite;
  }
  .glow2 {
    background: radial-gradient(circle, rgba(0,207,255,.08) 0%, transparent 70%);
    top: auto; left: auto;
    bottom: -200px; right: -200px;
    animation: floatGlow2 10s ease-in-out infinite;
  }
  @keyframes floatGlow  { 0%,100%{transform:translate(0,0)} 50%{transform:translate(60px,40px)} }
  @keyframes floatGlow2 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(-40px,-60px)} }

  .hero {
    position: relative;
    text-align: center;
    animation: fadeUp .8s ease both;
  }
  @keyframes fadeUp { from{opacity:0;transform:translateY(30px)} to{opacity:1;transform:translateY(0)} }

  .badge {
    display: inline-block;
    font-family: var(--mono);
    font-size: .7rem;
    letter-spacing: .15em;
    color: var(--accent);
    border: 1px solid var(--accent);
    padding: .3rem .9rem;
    border-radius: 2px;
    margin-bottom: 1.8rem;
    text-transform: uppercase;
  }
  h1 {
    font-size: clamp(3rem, 8vw, 6rem);
    font-weight: 800;
    letter-spacing: -.02em;
    line-height: 1;
    margin-bottom: 1rem;
  }
  h1 span { color: var(--accent); }
  .subtitle {
    font-family: var(--mono);
    font-size: .85rem;
    color: var(--muted);
    letter-spacing: .05em;
    margin-bottom: 3rem;
    max-width: 480px;
  }
  .actions {
    display: flex;
    gap: 1rem;
    justify-content: center;
    flex-wrap: wrap;
  }
  .btn {
    font-family: var(--mono);
    font-size: .85rem;
    letter-spacing: .08em;
    text-decoration: none;
    padding: .85rem 2.2rem;
    border-radius: 3px;
    transition: all .2s;
    text-transform: uppercase;
    font-weight: 700;
  }
  .btn-primary {
    background: var(--accent);
    color: #000;
  }
  .btn-primary:hover { background: #00e87a; transform: translateY(-2px); box-shadow: 0 8px 30px rgba(0,255,136,.3); }
  .btn-secondary {
    background: transparent;
    color: var(--text);
    border: 1px solid var(--border);
  }
  .btn-secondary:hover { border-color: var(--accent2); color: var(--accent2); transform: translateY(-2px); }

  .features {
    position: relative;
    margin-top: 5rem;
    display: flex;
    gap: 1px;
    background: var(--border);
    border: 1px solid var(--border);
    border-radius: 4px;
    overflow: hidden;
    animation: fadeUp 1s .3s ease both;
  }
  .feat {
    background: var(--surface);
    padding: 1.2rem 1.6rem;
    flex: 1;
    min-width: 140px;
  }
  .feat-icon { font-size: 1.2rem; margin-bottom: .4rem; }
  .feat-label {
    font-family: var(--mono);
    font-size: .68rem;
    color: var(--muted);
    letter-spacing: .1em;
    text-transform: uppercase;
  }
  .feat-val {
    font-weight: 700;
    font-size: .95rem;
    color: var(--text);
    margin-top: .1rem;
  }
</style>
</head>
<body>
<div class="grid-bg"></div>
<div class="glow"></div>
<div class="glow glow2"></div>

<div class="hero">
  <div class="badge">🔒 Cybersecurity Lab — Internship Project</div>
  <h1>Access<span>Guard</span></h1>
  <p class="subtitle">// secure auth · brute-force protection · role-based access · audit logs</p>
  <div class="actions">
    <a href="/login" class="btn btn-primary">→ Login</a>
    <a href="/register" class="btn btn-secondary">Create Account</a>
  </div>

  <div class="features">
    <div class="feat"><div class="feat-icon">🔑</div><div class="feat-label">Hashing</div><div class="feat-val">SHA-256</div></div>
    <div class="feat"><div class="feat-icon">🛡️</div><div class="feat-label">Lockout</div><div class="feat-val">3 Attempts</div></div>
    <div class="feat"><div class="feat-icon">📋</div><div class="feat-label">Logs</div><div class="feat-val">Audit Trail</div></div>
    <div class="feat"><div class="feat-icon">👥</div><div class="feat-label">RBAC</div><div class="feat-val">Admin / User</div></div>
    <div class="feat"><div class="feat-icon">🗄️</div><div class="feat-label">DB Safety</div><div class="feat-val">Parameterized</div></div>
  </div>
</div>
</body>
</html>
